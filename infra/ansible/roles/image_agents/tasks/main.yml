---
# Agentes de observabilidad en TODAS las AMIs. Prometheus (servidor de monitoreo) los
# descubre por etiquetas EC2 y los scrapea; el SG del tenant solo abre estos puertos
# al SG del monitoreo.
#   node_exporter 9100 · process_exporter 9256 · otelcol (métricas) 8889 · netdata 19999

- name: Usuario sin login para los exporters
  ansible.builtin.user:
    name: exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Descargar node_exporter y process_exporter
  ansible.builtin.unarchive:
    src: "{{ item.url }}"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ item.dir }}/{{ item.bin }}"
  loop: "{{ exporters }}"
  loop_control: { label: "{{ item.bin }}" }

- name: Instalar los binarios de los exporters
  ansible.builtin.copy:
    src: "/tmp/{{ item.dir }}/{{ item.bin }}"
    dest: "/usr/local/bin/{{ item.bin }}"
    remote_src: true
    mode: "0755"
  loop: "{{ exporters }}"
  loop_control: { label: "{{ item.bin }}" }

- name: Configuración de process_exporter (agrupa por nombre de proceso)
  ansible.builtin.copy:
    dest: /etc/process-exporter.yml
    mode: "0644"
    content: |
      process_names:
        - name: "{{ '{{' }}.Comm{{ '}}' }}"
          cmdline:
            - '.+'

- name: Servicios systemd de los exporters
  ansible.builtin.template:
    src: exporter.service.j2
    dest: "/etc/systemd/system/{{ item.bin }}.service"
    mode: "0644"
  loop: "{{ exporters }}"
  loop_control: { label: "{{ item.bin }}" }

- name: Instalar OpenTelemetry Collector (contrib)
  ansible.builtin.apt:
    deb: "{{ otelcol_deb }}"

- name: Configuración del collector (OTLP + métricas de host -> Prometheus :8889)
  ansible.builtin.template:
    src: otelcol.yaml.j2
    dest: /etc/otelcol-contrib/config.yaml
    mode: "0644"

- name: Instalar Netdata
  ansible.builtin.apt:
    name: netdata
    state: present

- name: Netdata escucha en todas las interfaces (el SG limita quién entra)
  ansible.builtin.copy:
    dest: /etc/netdata/netdata.conf
    mode: "0644"
    content: |
      [global]
          memory mode = dbengine
      [web]
          bind to = 0.0.0.0:19999

- name: Activar los agentes al arrancar
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: [node_exporter, process-exporter, otelcol-contrib, netdata]
