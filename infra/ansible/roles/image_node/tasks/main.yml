---
- name: Descargar Node.js {{ node_version }}
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ node_version }}/node-v{{ node_version }}-linux-x64.tar.xz"
    dest: "/tmp/node-v{{ node_version }}.tar.xz"
    checksum: "sha256:https://nodejs.org/dist/v{{ node_version }}/SHASUMS256.txt"
    mode: "0644"

- name: Instalar Node.js en /usr/local
  ansible.builtin.unarchive:
    src: "/tmp/node-v{{ node_version }}.tar.xz"
    dest: /usr/local
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: /usr/local/bin/node

- name: Instalar pnpm {{ pnpm_version }}
  ansible.builtin.command:
    cmd: "npm install --global pnpm@{{ pnpm_version }}"
    creates: /usr/local/bin/pnpm

# Compilar NestJS/Vite en una t3.small necesita más que 2 GB; el swap queda también en la VM.
- name: Crear swap de 2 GB
  ansible.builtin.shell: |
    set -e
    fallocate -l 2G /swapfile
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    echo '/swapfile none swap sw 0 0' >> /etc/fstab
  args:
    creates: /swapfile
