[defaults]
roles_path = roles
# Un archivo, no "localhost,": en ansible.cfg el valor es una lista de RUTAS y la entrada
# vacía tras la coma cargaba todo el directorio como inventario (hosts falsos).
inventory = inventory.ini
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
# Los logs de cloud-init y de la plataforma no deben mostrar secretos: las tareas
# que tocan contraseñas usan no_log: true.
display_args_to_stdout = false
