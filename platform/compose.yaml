services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance_platform
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - platform_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance_platform"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  platform_postgres:
